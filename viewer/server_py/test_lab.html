<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEP 特征查看 · 测试台</title>
<style>
  :root {
    --bg: #1c2128;
    --panel: #232a33;
    --border: #333c47;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #ff8c42;
    --accent-soft: rgba(255, 140, 66, 0.15);
    --ok: #46a46c;
    --err: #e5484d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
    min-height: 100vh; padding: 32px 24px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px; margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 13px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  input[type="file"] { font-size: 14px; color: var(--text); }
  textarea {
    width: 100%; min-height: 180px; resize: vertical;
    background: #14181d; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px; font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 12.5px; line-height: 1.5;
  }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    background: var(--accent); color: #1c120a; border: none; border-radius: 6px;
    padding: 10px 22px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin-top: 14px; font-size: 13px; min-height: 18px; }
  #status.err { color: var(--err); }
  #status.ok { color: var(--ok); }
  #urlBox { margin-top: 8px; }
  #urlBox input {
    width: 100%; background: #14181d; color: var(--accent); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px; font-family: "Cascadia Mono", Consolas, monospace; font-size: 12.5px;
  }
  .row { display: flex; align-items: center; gap: 12px; }
  .row a {
    color: var(--accent); font-size: 13px; text-decoration: none; font-weight: 600;
    background: var(--accent-soft); padding: 8px 14px; border-radius: 6px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>STEP 特征查看 · 测试台</h1>
    <div class="sub">上传 STEP 文件（可选粘贴特征识别 JSON）→ 生成可访问链接 → 新标签页打开查看</div>

    <div class="card">
      <label for="stepFile">STEP 文件（.step / .stp）</label>
      <input type="file" id="stepFile" accept=".step,.stp">
      <div class="hint">只上传 STEP：仅查看模型；同时提供 JSON：展示特征树。</div>
    </div>

    <div class="card">
      <label for="featuresJson">特征识别 JSON（文本粘贴，可选）</label>
      <textarea id="featuresJson" spellcheck="false" placeholder='{"code":200,"partType":"rectangular_part", …}'></textarea>
      <div class="hint">识别服务返回的 JSON 响应体（含 rectangular_part / relatedEntityIds 等）。留空则只打开模型。</div>
    </div>

    <div class="row">
      <button id="createBtn" type="button">生成链接并打开</button>
      <a id="openLink" href="#" target="_blank" rel="noopener" style="display:none">在标签页打开</a>
    </div>
    <div id="status"></div>
    <div id="urlBox" style="display:none">
      <label for="url">查看链接（可复制）</label>
      <input id="url" readonly>
    </div>
  </div>

<script>
(function () {
  "use strict";
  const stepFile = document.getElementById("stepFile");
  const featuresJson = document.getElementById("featuresJson");
  const createBtn = document.getElementById("createBtn");
  const openLink = document.getElementById("openLink");
  const statusEl = document.getElementById("status");
  const urlBox = document.getElementById("urlBox");
  const urlInput = document.getElementById("url");

  function setStatus(text, kind) {
    statusEl.textContent = text || "";
    statusEl.className = kind ? kind : "";
  }

  function readFileAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ""));
      reader.onerror = () => reject(new Error("读取文件失败"));
      reader.readAsDataURL(file);
    });
  }

  createBtn.addEventListener("click", async () => {
    setStatus("", "");
    urlBox.style.display = "none";
    openLink.style.display = "none";
    const file = stepFile.files && stepFile.files[0];
    if (!file) {
      setStatus("请先选择 STEP 文件", "err");
      return;
    }
    const lower = file.name.toLowerCase();
    if (!/\.(step|stp)$/.test(lower)) {
      setStatus("仅支持 .step / .stp 文件", "err");
      return;
    }
    let dataUrl;
    try {
      dataUrl = await readFileAsDataUrl(file);
    } catch (err) {
      setStatus(err.message, "err");
      return;
    }
    const stepData = dataUrl.slice(dataUrl.indexOf(",") + 1);
    const featuresText = featuresJson.value.trim();
    const body = { stepName: file.name, stepData: stepData };
    if (featuresText) {
      try {
        JSON.parse(featuresText);
      } catch (err) {
        setStatus("特征识别 JSON 格式无效：" + err.message, "err");
        return;
      }
      body.featuresJson = featuresText;
    }
    createBtn.disabled = true;
    setStatus("正在生成链接…");
    try {
      const res = await fetch("/__cad/link", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body)
      });
      let payload = null;
      try {
        payload = await res.json();
      } catch (err) {
        payload = null;
      }
      if (!res.ok || !payload || !payload.url) {
        throw new Error((payload && payload.error) || ("HTTP " + res.status));
      }
      urlInput.value = payload.url;
      urlBox.style.display = "block";
      openLink.href = payload.url;
      openLink.style.display = "inline-block";
      setStatus("链接已生成" + (payload.features ? "（含特征树）" : "（仅模型）"), "ok");
      window.open(payload.url, "_blank");
    } catch (err) {
      setStatus("生成失败：" + err.message, "err");
    } finally {
      createBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
